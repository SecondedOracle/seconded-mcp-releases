name: Publish MCP Registry 0.4.5

'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-registry.yml
      - registry/server.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry-0.4.5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PUBLIC_BASE: 80eca7a5f8740164e48e6baa56e385b2638930de
      EXPECTED_MANIFEST_SHA256: 403df6f1b4b92021d3e2b158c230996f4ecfac5ab6f76ccecc1ee3c63bb1e681
    steps:
      - name: Require the organization bot on main
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY" = SecondedOracle/seconded-mcp-releases
          test "$OWNER" = SecondedOracle
          test "$REF" = refs/heads/main
          test "$ACTOR" = 'seconded-publisher[bot]'
          test "$TRIGGERING_ACTOR" = 'seconded-publisher[bot]'
          case "$EVENT" in push|workflow_dispatch) ;; *) exit 1 ;; esac

      - name: Check out the triggering commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed paths and committed bytes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess

          base = os.environ["EXPECTED_PUBLIC_BASE"]
          head = os.environ["GITHUB_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("Invalid triggering commit")
          parents = subprocess.check_output([
              "git", "rev-list", "--parents", "-n", "1", head,
          ]).decode().split()
          if parents != [head, base]:
              raise SystemExit("Triggering commit must have the reviewed public base as its only parent")
          public_head = subprocess.check_output([
              "git", "rev-parse", "refs/remotes/origin/main",
          ]).decode().strip()
          if public_head != head:
              raise SystemExit("Public main differs from the triggering commit; inspect before retrying")
          if os.environ["EVENT"] == "push" and os.environ["BEFORE"] != base:
              raise SystemExit("Push must start from the reviewed public base")
          changed = subprocess.check_output([
              "git", "diff", "--name-only", "-z", base, head, "--",
          ]).split(b"\0")
          allowed = {b".github/workflows/publish-registry.yml", b"registry/server.json"}
          if set(changed) - {b""} != allowed:
              raise SystemExit("Commit must change exactly the two approved publish inputs")
          PY
          cmp registry/server.json <(git show "$GITHUB_SHA:registry/server.json")
          printf '%s  registry/server.json\n' "$EXPECTED_MANIFEST_SHA256" | sha256sum -c -

      - name: Check the manifest and published npm identity
        shell: bash
        run: |
          set -euo pipefail
          curl -q --fail --silent --show-error --proto '=https' \
            --connect-timeout 10 --max-time 60 \
            https://registry.npmjs.org/@seconded%2fmcp/0.4.5 \
            -o "$RUNNER_TEMP/seconded-npm-0.4.5.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = Path("registry/server.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["EXPECTED_MANIFEST_SHA256"]:
              raise SystemExit("Committed manifest digest mismatch")
          server = json.loads(raw)
          name = "io.github.SecondedOracle/seconded-mcp"
          package = {
              "registryType": "mcpb",
              "identifier": "https://github.com/SecondedOracle/seconded-mcp-releases/"
                            "releases/download/v0.4.5/seconded-mcp_0.4.5.mcpb",
              "fileSha256": "f098d424b6f1d30db1733debe870b08ad14b6c35be5234155e3871ce6c0bbe8d",
              "transport": {"type": "stdio"},
          }
          if server.get("name") != name or server.get("version") != "0.4.5":
              raise SystemExit("Registry name/version mismatch")
          # The approved committed JSON is MCPB-only. Never add npm or rewrite it here.
          if server.get("packages") != [package]:
              raise SystemExit("MCPB URL/digest/transport or package inventory mismatch")
          npm = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                            "seconded-npm-0.4.5.json").read_bytes())
          expected = {"name": "@seconded/mcp", "version": "0.4.5", "mcpName": name}
          if any(npm.get(key) != value for key, value in expected.items()):
              raise SystemExit("Published npm identifier/version/mcpName mismatch")
          PY

      - name: Verify the existing bundle and pinned publisher
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/registry-publisher-0.4.5"
          cd "$RUNNER_TEMP/registry-publisher-0.4.5"
          curl -q --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --connect-timeout 10 --max-time 120 \
            https://github.com/SecondedOracle/seconded-mcp-releases/releases/download/v0.4.5/seconded-mcp_0.4.5.mcpb \
            -o seconded-mcp_0.4.5.mcpb
          printf '%s  seconded-mcp_0.4.5.mcpb\n' \
            f098d424b6f1d30db1733debe870b08ad14b6c35be5234155e3871ce6c0bbe8d | sha256sum -c -
          curl -q --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --connect-timeout 10 --max-time 120 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            -o publisher.tar.gz
          printf '%s  publisher.tar.gz\n' \
            a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc | sha256sum -c -
          tar -xzf publisher.tar.gz mcp-publisher
          printf '%s\n' "$RUNNER_TEMP/registry-publisher-0.4.5" >> "$GITHUB_PATH"

      - name: Validate and require an unpublished version
        shell: bash
        run: |
          set -euo pipefail
          mcp-publisher validate registry/server.json
          curl -q --fail --silent --show-error --proto '=https' \
            --connect-timeout 10 --max-time 60 \
            https://registry.modelcontextprotocol.io/v0.1/servers/io.github.SecondedOracle%2Fseconded-mcp/versions/0.3.0 |
            jq -e '.server.name == "io.github.SecondedOracle/seconded-mcp" and .server.version == "0.3.0"'
          code=$(curl -q --silent --show-error --proto '=https' \
            --connect-timeout 10 --max-time 60 --output /dev/null --write-out '%{http_code}' \
            https://registry.modelcontextprotocol.io/v0.1/servers/io.github.SecondedOracle%2Fseconded-mcp/versions/0.4.5)
          if [ "$code" != 404 ]; then
            echo "Expected absent 0.4.5 (404), got $code; inspect the listing before retrying." >&2
            exit 1
          fi

      - name: Authenticate and publish as the repository owner
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io
          printf '%s  registry/server.json\n' "$EXPECTED_MANIFEST_SHA256" | sha256sum -c -
          mcp-publisher publish registry/server.json

      - name: Read back the published version
        shell: bash
        run: |
          set -euo pipefail
          curl -q --fail --silent --show-error --proto '=https' \
            --connect-timeout 10 --max-time 60 \
            https://registry.modelcontextprotocol.io/v0.1/servers/io.github.SecondedOracle%2Fseconded-mcp/versions/0.4.5 |
            jq -e --slurpfile expected registry/server.json \
              '.server.name == $expected[0].name and .server.version == $expected[0].version and
               .server.packages == $expected[0].packages and
               ._meta["io.modelcontextprotocol.registry/official"].status == "active"'
          curl -q --fail --silent --show-error --proto '=https' \
            --connect-timeout 10 --max-time 60 \
            https://registry.modelcontextprotocol.io/v0.1/servers/io.github.SecondedOracle%2Fseconded-mcp/versions/0.3.0 |
            jq -e '.server.name == "io.github.SecondedOracle/seconded-mcp" and .server.version == "0.3.0"'
